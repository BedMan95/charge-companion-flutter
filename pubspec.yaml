name: chargecompanion
description: "EV Charging App. Based on Tuya Smart Plug"

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.5.3
  http: ^1.2.1
  lucide_icons: ^0.257.0
  crypto: ^3.0.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  uuid: ^4.6.0
  permission_handler: ^12.0.3
  flutter_local_notifications: ^19.5.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  fetch_client: ^1.2.1
  google_fonts: ^6.3.0
  package_info_plus: 8.0.0
  flutter_native_splash: ^2.4.4
  intl: ^0.19.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/generated_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/generated_icon.png"
  color_dark: "#121212"
  image_dark: "assets/images/generated_icon.png"
  fullscreen: true
  android_12:
    image: "assets/images/generated_icon.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/images/generated_icon.png"
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
